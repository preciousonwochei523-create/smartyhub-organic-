<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>SmartyHub Admin</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>tailwind.config={theme:{extend:{colors:{g1:'#1B5E20',g2:'#2E7D32',g3:'#4CAF50'}}}}</script>
<style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}input,select,textarea{width:100%;border:1px solid #e5e5e5;border-radius:.75rem;padding:.6rem .75rem;font-size:.95rem;background:#fff}label{display:block;font-size:.75rem;font-weight:700;color:#525252;margin:.9rem 0 .25rem}.btn{border-radius:9999px;padding:.55rem 1rem;font-weight:700;font-size:.85rem}.noscroll::-webkit-scrollbar{display:none}@keyframes up{from{transform:translateY(100%)}to{transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}.drawer{animation:up .22s ease-out}.scrim{animation:fade .2s}.blk{border:1px solid #e5e5e5;border-radius:1rem;padding:.25rem 1rem 1rem;margin-top:.9rem;background:#fafafa}.blk h3{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#2E7D32;margin-top:.9rem}.blk label:first-of-type{margin-top:.5rem}</style>
</head>
<body class="bg-neutral-50 text-neutral-900">

<header class="sticky top-0 z-30 border-b border-neutral-200 bg-white/95 backdrop-blur">
  <div class="mx-auto flex max-w-3xl items-center justify-between gap-2 px-4 py-3">
    <h1 class="text-lg font-extrabold text-g1">SmartyHub Admin</h1>
    <div class="flex gap-2"><a href="./" target="_blank" class="btn border border-neutral-300">View site</a><button id="so" class="btn hidden bg-neutral-800 text-white" onclick="signOut()">Sign out</button></div>
  </div>
  <nav id="tabs" class="noscroll mx-auto flex max-w-3xl gap-2 overflow-x-auto px-4 pb-3"></nav>
</header>

<main id="main" class="mx-auto max-w-3xl px-4 pb-24 pt-4"></main>
<div id="sheet"></div>
<div id="toast" class="pointer-events-none fixed bottom-5 left-1/2 z-[80] -translate-x-1/2 translate-y-20 rounded-full bg-black px-5 py-3 text-sm font-semibold text-white opacity-0 transition-all duration-300"></div>

<script>
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>"₦"+(+n||0).toLocaleString("en-NG");
const X='<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
let D=null, tab="orders", q="", E=null, EK="", isNew=false, sb=null, SORT={};
const REC=/type=recovery/.test(location.hash), CFG=window.SHO_SB||{}, BUCKET="product-images";

function toast(t){const e=$("#toast");e.textContent=t;e.style.opacity=1;e.style.transform="translate(-50%,0)";clearTimeout(toast.t);toast.t=setTimeout(()=>{e.style.opacity=0;e.style.transform="translate(-50%,5rem)"},2600)}
function toBlob(file,max=800){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.82)};im.onerror=rej;im.src=u})}
async function upload(file,max){
  const blob=await toBlob(file,max),path=Date.now()+"-"+Math.random().toString(36).slice(2,7)+".jpg";
  const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:"image/jpeg",cacheControl:"31536000"});
  if(error)throw error;return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

/* ---------- start, login, load ---------- */
async function init(){
  if(!CFG.url||!CFG.key||/YOUR/.test(CFG.url+CFG.key)){
    $("#main").innerHTML=`<div class="rounded-2xl bg-white p-5 shadow-sm"><h2 class="font-extrabold">Connect Supabase first</h2><p class="mt-2 text-sm text-neutral-600">Open <code>supabase-config.js</code> and paste your Project URL and anon key (Supabase, Project Settings, API). Then reload this page.</p></div>`;return}
  const REC=/type=recovery/.test(location.hash+location.search);
  sb=supabase.createClient(CFG.url,CFG.key);
  sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")pwView(true)});
  const {data}=await sb.auth.getSession();
  if(REC&&data.session)return pwView(true);
  data.session?boot():loginView();
}
function loginView(){
  $("#tabs").innerHTML="";$("#so").classList.add("hidden");
  $("#main").innerHTML=`<form onsubmit="event.preventDefault();login(this)" class="mx-auto mt-6 max-w-sm rounded-2xl bg-white p-5 shadow-sm"><h2 class="text-lg font-extrabold">Admin sign in</h2>
  <label>Email</label><input name="e" type="email" required autocomplete="username"/><label>Password</label><input name="p" type="password" required autocomplete="current-password"/>
  <button class="btn mt-4 w-full bg-g2 py-3 text-white">Sign in</button>
  <button type="button" onclick="forgot(this.form)" class="mt-3 w-full text-center text-sm font-semibold text-g2 underline">Forgot password?</button></form>`;
}
async function login(f){
  const {error}=await sb.auth.signInWithPassword({email:f.e.value.trim(),password:f.p.value});
  error?toast(error.message):boot();
}
async function forgot(f){
  const e=f.e.value.trim();if(!e)return toast("Type your email first");
  const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});
  toast(error?error.message:"Reset link sent. Check your email.");
}
function recoveryView(){
  $("#tabs").innerHTML="";$("#so").classList.add("hidden");
  $("#main").innerHTML=`<form onsubmit="event.preventDefault();setPw(this)" class="mx-auto mt-6 max-w-sm rounded-2xl bg-white p-5 shadow-sm"><h2 class="text-lg font-extrabold">Set a new password</h2>
  <label>New password (at least 8 characters)</label><input name="p1" type="password" minlength="8" required autocomplete="new-password"/>
  <label>Confirm new password</label><input name="p2" type="password" minlength="8" required autocomplete="new-password"/>
  <button class="btn mt-4 w-full bg-g2 py-3 text-white">Save password</button></form>`;
}
async function setPw(f){
  if(f.p1.value!==f.p2.value)return toast("Passwords do not match");
  const {error}=await sb.auth.updateUser({password:f.p1.value});
  if(error)return toast(error.message);
  history.replaceState(null,"",location.pathname);toast("Password updated");boot();
}
async function signOut(){await sb.auth.signOut();D=null;loginView()}
async function forgot(f){
  const e=f.e.value.trim();if(!e)return toast("Type your email above first");
  const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});
  toast(error?error.message:"If that email is registered, a reset link has been sent. Open it on this device.");
}
function pwView(rec){
  $("#tabs").innerHTML="";$("#so").classList.toggle("hidden",!!rec);
  $("#main").innerHTML=`<form onsubmit="event.preventDefault();setPw(this)" class="mx-auto mt-6 max-w-sm rounded-2xl bg-white p-5 shadow-sm"><h2 class="text-lg font-extrabold">${rec?"Set a new password":"Change password"}</h2>
  <label>New password (at least 8 characters)</label><input name="a" type="password" minlength="8" required autocomplete="new-password"/>
  <label>Repeat new password</label><input name="b" type="password" minlength="8" required autocomplete="new-password"/>
  <button class="btn mt-4 w-full bg-g2 py-3 text-white">Save password</button>
  ${rec?"":'<button type="button" onclick="boot()" class="mt-3 w-full text-center text-sm font-semibold text-neutral-500 underline">Cancel</button>'}</form>`;
}
async function setPw(f){
  if(f.a.value!==f.b.value)return toast("Passwords do not match");
  const {error}=await sb.auth.updateUser({password:f.a.value});
  if(error)return toast(error.message);
  history.replaceState(null,"",location.pathname);toast("Password saved");boot();
}
async function boot(){
  $("#so").classList.remove("hidden");$("#main").innerHTML='<p class="py-16 text-center text-neutral-500">Loading…</p>';
  await load();draw();if(tab==="orders")ordersLoad();
}
async function load(){
  const [a,b]=await Promise.all([sb.from("items").select("id,kind,data,sort").order("sort"),sb.from("settings").select("key,value")]);
  if(a.error||b.error)toast("Could not load: "+(a.error||b.error).message);
  const it=a.data||[],st=Object.fromEntries((b.data||[]).map(r=>[r.key,r.value]));
  SORT={};it.forEach(r=>SORT[r.id]=r.sort);
  D={eats:it.filter(i=>i.kind==="eat").map(i=>i.data),supps:it.filter(i=>i.kind==="supp").map(i=>i.data),eatCats:st.eatCats||[],suppCats:st.suppCats||[],hero:st.hero||[],zones:st.zones||[],kitchens:st.kitchens||[],riders:st.riders||[]};
}
async function setting(key,value){const {error}=await sb.from("settings").upsert({key,value});if(error){toast("Save failed: "+error.message);return false}return true}

/* ---------- screens ---------- */
const TABS=[["orders","Orders"],["eats","Breakfast & Eats"],["supps","Supplements"],["ops","Delivery & Partners"],["cats","Categories & Hero"],["pub","Backup & Import"]];
function draw(){
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button onclick="go('${k}')" class="btn shrink-0 ${tab===k?"bg-g2 text-white":"bg-white border border-neutral-300"}">${l}</button>`).join("");
  $("#main").innerHTML=tab==="orders"?ordersView():tab==="ops"?opsView():tab==="cats"?catsView():tab==="pub"?pubView():listView(tab);
}
function go(t){tab=t;q="";draw();if(t==="orders")ordersLoad();scrollTo(0,0)}
function status(x){return x.hide?["Hidden","bg-neutral-200 text-neutral-600"]:x.soon?["Coming soon","bg-amber-100 text-amber-800"]:x.out?["Sold out","bg-red-100 text-red-700"]:["Available","bg-green-100 text-g1"]}
function listView(k){
  const L=D[k].filter(x=>(x.n+(x.b||"")+(x.cat||x.g||"")).toLowerCase().includes(q.toLowerCase()));
  return `<div class="flex gap-2"><input placeholder="Search items" value="${esc(q)}" oninput="q=this.value;$('#lst').innerHTML=rows('${k}')"/><button class="btn shrink-0 bg-g2 text-white" onclick="edit('${k}')">+ Add</button></div>
  <div class="mt-2 flex flex-wrap gap-2"><label class="btn m-0 cursor-pointer border border-neutral-300 bg-white" style="margin:0">Import CSV<input type="file" accept=".csv,text/csv,text/plain" class="hidden" onchange="csvImport('${k}',this)"/></label><button class="btn border border-neutral-300 bg-white" onclick="csvTemplate('${k}')">CSV template</button><button class="btn border border-neutral-300 bg-white" onclick="csvExport('${k}')">Export CSV</button></div>
  <p class="mt-3 text-xs text-neutral-500">${D[k].length} items. Tap an item to edit price, details, photos or stock.</p>
  <div id="lst" class="mt-3 space-y-3">${rows(k)}</div>`;
}
function rows(k){
  const L=D[k].filter(x=>(x.n+(x.b||"")+(x.cat||x.g||"")).toLowerCase().includes(q.toLowerCase()));
  if(!L.length)return '<p class="py-10 text-center text-neutral-500">Nothing here yet.</p>';
  return L.map(x=>{const [s,c]=status(x);return `<button onclick="edit('${k}','${x.id}')" class="flex w-full items-center gap-3 rounded-2xl border border-neutral-200 bg-white p-3 text-left shadow-sm">
    <div class="flex h-16 w-16 shrink-0 items-center justify-center overflow-hidden rounded-xl bg-green-50 text-xs text-g2">${x.img?`<img src="${esc(x.img)}" class="h-full w-full object-cover" onerror="this.remove()"/>`:"No photo"}</div>
    <div class="min-w-0 flex-1"><p class="truncate font-bold">${esc(x.n)}</p><p class="truncate text-xs text-neutral-500">${esc(x.cat||x.g||"")}${x.b?" · "+esc(x.b):""}</p><p class="mt-0.5 font-bold text-g2">${x.soon?"—":fmt(x.p)}</p></div>
    <span class="shrink-0 rounded-full px-2.5 py-1 text-[11px] font-bold ${c}">${s}</span></button>`}).join("");
}

/* ---------- item editor ---------- */
function edit(k,id){
  EK=k;isNew=!id;
  E=id?JSON.parse(JSON.stringify(D[k].find(x=>x.id===id))):(k==="eats"
    ?{id:"e"+Date.now().toString(36),cat:D.eatCats[0]||"",n:"",p:0,d:"",img:"",imgs:[],i:"sandwich",o:[]}
    :{id:"p"+Date.now().toString(36),g:D.suppCats[0]||"",n:"",b:"",p:0,dose:"",r:4.5,rv:0,ing:[],d:"",img:"",imgs:[],i:"leaf"});
  if(!Array.isArray(E.imgs))E.imgs=E.img?[E.img]:[];
  sheet();
}
function stVal(){return E.hide?"hide":E.soon?"soon":E.out?"out":"ok"}
function sheet(){
  const eats=EK==="eats", cats=eats?D.eatCats:D.suppCats, cur=eats?E.cat:E.g;
  $("#sheet").innerHTML=`<div class="fixed inset-0 z-50 flex items-end justify-center bg-black/40 sm:items-center sm:p-4" onclick="if(event.target===this)closeSheet()">
  <form id="f" onsubmit="event.preventDefault();saveItem()" class="flex max-h-[94vh] w-full max-w-lg flex-col overflow-hidden rounded-t-3xl bg-white shadow-2xl sm:rounded-3xl">
    <div class="flex items-center justify-between border-b border-neutral-100 px-5 py-3"><h2 class="text-lg font-extrabold">${isNew?"Add":"Edit"} ${eats?"menu item":"supplement"}</h2><button type="button" onclick="closeSheet()" class="rounded-full bg-neutral-100 p-2" aria-label="Close">${X}</button></div>
    <div class="overflow-y-auto px-5 pb-4">
      <label>Photos <span class="font-normal text-neutral-400">(the first one is the cover. Customers can slide through all of them.)</span></label>
      <div id="pv" class="grid grid-cols-4 gap-2">${gThumbs()}</div>
      <label class="btn mt-2 inline-block cursor-pointer bg-g2 !text-white" style="margin-top:.5rem">+ Upload photos<input type="file" accept="image/*" multiple class="hidden" onchange="pickImgs(this)"/></label>
      <label>Name</label><input name="n" required value="${esc(E.n)}"/>
      ${eats?"":`<label>Brand (optional)</label><input name="b" value="${esc(E.b||"")}"/>`}
      <label>${eats?"Category":"Health goal / category"}</label><select name="cat">${cats.map(c=>`<option ${c===cur?"selected":""}>${esc(c)}</option>`).join("")}</select>
      <label>Price (₦)</label><input name="p" type="number" min="0" step="50" inputmode="numeric" value="${E.p}"/>
      <label>Description</label><textarea name="d" rows="3">${esc(E.d)}</textarea>
      ${eats?"":`<label>Dosage</label><input name="dose" value="${esc(E.dose||"")}" placeholder="1 tablet daily"/>
      <label>Key ingredients (comma separated)</label><input name="ing" value="${esc((E.ing||[]).join(", "))}"/>
      <div class="grid grid-cols-2 gap-3"><div><label>Rating (0 to 5)</label><input name="r" type="number" min="0" max="5" step="0.1" value="${E.r}"/></div><div><label>Number of reviews</label><input name="rv" type="number" min="0" value="${E.rv}"/></div></div>`}
      <label>Availability</label><select name="st"><option value="ok">Available</option><option value="out">Sold out</option>${eats?'<option value="soon">Coming soon</option>':""}<option value="hide">Hidden from the site</option></select>
      ${eats?optsEditor():""}
    </div>
    <div class="flex gap-2 border-t border-neutral-100 px-5 py-3">${isNew?"":`<button type="button" class="btn border border-red-300 text-red-600" onclick="delItem()">Delete</button>`}<button class="btn flex-1 bg-g2 py-3 text-white">Save</button></div>
  </form></div>`;
  $("#f").st.value=stVal();
}
function optsEditor(){
  return `<label>Choices customers pick from (optional)</label>
  ${E.o.map((g,i)=>`<div class="mb-3 rounded-2xl border border-neutral-200 p-3" data-g="${i}">
    <div class="flex gap-2"><input class="gt" placeholder="Group title, e.g. Size" value="${esc(g.t)}"/><button type="button" class="rounded-full bg-neutral-100 px-3" onclick="rmGroup(${i})" aria-label="Remove group">${X}</button></div>
    <select class="gk mt-2"><option value="r" ${g.k==="r"?"selected":""}>Customer must pick one</option><option value="c" ${g.k==="c"?"selected":""}>Optional add-ons (tick any)</option></select>
    <textarea class="gc mt-2" rows="3" placeholder="One per line: Name | extra price">${esc((g.c||[]).map(c=>c[0]+" | "+c[1]).join("\n"))}</textarea></div>`).join("")}
  <button type="button" class="btn border border-neutral-300" onclick="addGroup()">+ Add choice group</button>`;
}
function collect(){
  const f=$("#f");if(!f)return;const eats=EK==="eats",v=n=>f.elements[n]?.value;
  E.n=v("n").trim();E.p=Math.max(0,Math.round(+v("p")||0));E.d=v("d").trim();
  if(eats)E.cat=v("cat");else{E.g=v("cat");E.b=v("b").trim();if(!E.b)delete E.b;E.dose=v("dose").trim();E.ing=v("ing").split(",").map(s=>s.trim()).filter(Boolean);E.r=Math.min(5,Math.max(0,+v("r")||0));E.rv=Math.max(0,Math.round(+v("rv")||0))}
  E.imgs=(E.imgs||[]).filter(Boolean);E.img=E.imgs[0]||"";
  const st=v("st");delete E.hide;delete E.out;delete E.soon;if(st==="hide")E.hide=1;if(st==="out")E.out=1;if(st==="soon")E.soon=1;
  if(eats)E.o=[...f.querySelectorAll("[data-g]")].map(d=>({t:d.querySelector(".gt").value.trim()||"Options",k:d.querySelector(".gk").value,c:d.querySelector(".gc").value.split("\n").map(l=>l.split("|")).map(a=>[a[0].trim(),Math.round(+(a[1]||0))||0]).filter(a=>a[0])})).filter(g=>g.c.length);
}
function addGroup(){collect();E.o.push({t:"",k:"r",c:[]});sheet()}
function rmGroup(i){collect();E.o.splice(i,1);sheet()}
async function saveItem(){
  collect();if(!E.n){toast("Add a name");return}
  const btn=$("#f button.flex-1");if(btn){btn.disabled=true;btn.textContent="Saving…"}
  const sort=SORT[E.id]??Math.floor(Date.now()/1000);
  const {error}=await sb.from("items").upsert({id:E.id,kind:EK==="eats"?"eat":"supp",data:E,sort,updated_at:new Date().toISOString()});
  if(error){toast("Save failed: "+error.message);if(btn){btn.disabled=false;btn.textContent="Save"}return}
  SORT[E.id]=sort;const L=D[EK],i=L.findIndex(x=>x.id===E.id);if(i<0)L.push(E);else L[i]=E;
  closeSheet();draw();toast("Saved. Live on the site now.");
}
async function delItem(){
  if(!confirm("Delete this item from the live site?"))return;
  const {error}=await sb.from("items").delete().eq("id",E.id);
  if(error){toast("Delete failed: "+error.message);return}
  D[EK]=D[EK].filter(x=>x.id!==E.id);closeSheet();draw();toast("Deleted");
}
function gThumbs(){
  const L=E.imgs||[];if(!L.length)return '<div class="col-span-4 flex h-20 items-center justify-center rounded-xl bg-green-50 text-xs text-g2">No photos yet</div>';
  return L.map((u,i)=>`<div class="relative aspect-square overflow-hidden rounded-xl bg-green-50"><img src="${esc(u)}" class="h-full w-full object-cover" onerror="this.style.opacity=.2"/>
    ${i?"":'<span class="absolute left-1 top-1 rounded-full bg-g2 px-1.5 text-[10px] font-bold text-white">Cover</span>'}
    <button type="button" class="absolute right-1 top-1 rounded-full bg-white p-1 shadow" onclick="imgRm(${i})" aria-label="Remove photo">${X}</button>
    ${i?`<button type="button" class="absolute bottom-1 left-1 rounded-full bg-white px-2 text-xs font-bold shadow" onclick="imgUp(${i})" aria-label="Move earlier" title="Move earlier">◀</button>`:""}</div>`).join("");
}
function imgRm(i){collect();E.imgs.splice(i,1);sheet()}
function imgUp(i){collect();[E.imgs[i-1],E.imgs[i]]=[E.imgs[i],E.imgs[i-1]];sheet()}
async function pickImgs(inp){
  const fs=[...inp.files];if(!fs.length)return;collect();let ok=0;
  for(let n=0;n<fs.length;n++){
    toast(`Uploading photo ${n+1} of ${fs.length}…`);
    try{E.imgs.push(await upload(fs[n],1000));ok++}catch(e){toast("Upload failed: "+(e.message||"check bucket policies"));break}
  }
  inp.value="";sheet();if(ok)toast(ok+(ok===1?" photo":" photos")+" added. Press Save to publish.");
}
function closeSheet(){$("#sheet").innerHTML=""}
addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

/* ---------- CSV import / export ---------- */
function csvParse(t){
  t=String(t||"").replace(/^\uFEFF/,"");
  const first=t.split(/\r?\n/)[0]||"",dl=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?";":(first.includes("\t")&&!first.includes(",")?"\t":",");
  const rows=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===dl){r.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);c="";if(r.some(x=>x.trim()!==""))rows.push(r);r=[]}
    else c+=ch}
  r.push(c);if(r.some(x=>x.trim()!==""))rows.push(r);return rows;
}
const csvQ=v=>{v=String(v??"");return /[",;\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const HDR={id:["id","itemid","sku"],name:["name","item","itemname","title","product","productname"],cat:["category","categories","cat","goal","healthgoal","type"],price:["price","amount","cost","ngn","naira","pricen"],desc:["description","desc","details","about"],imgs:["images","image","photos","photo","imageurls","imageurl","img","pictures","picture"],status:["status","availability","stock"],opts:["options","choices","addons","extras"],brand:["brand","maker"],dose:["dosage","dose","howtotake"],ing:["ingredients","keyingredients","ingredient"],rating:["rating","stars"],rv:["reviews","numberofreviews","reviewcount"]};
function csvMap(head){const m={},norm=h=>String(h).toLowerCase().replace(/[^a-z0-9]/g,"");
  head.forEach((h,i)=>{const n=norm(h);for(const k in HDR)if(m[k]===undefined&&HDR[k].includes(n))m[k]=i});return m}
function csvStatus(v){v=String(v||"").toLowerCase().replace(/[^a-z]/g,"");if(!v)return null;
  if(/^(hide|hidden|draft|off|unlisted)$/.test(v))return"hide";if(/^(out|soldout|outofstock|unavailable)$/.test(v))return"out";if(/^(soon|comingsoon)$/.test(v))return"soon";return"ok"}
function csvOpts(t){return String(t||"").split("||").map(g=>g.trim()).filter(Boolean).map(g=>{
  const a=g.indexOf(":"),b=g.indexOf(":",a+1);if(a<0||b<0)return null;
  const title=g.slice(0,a).trim()||"Options",kind=/^(c|add|addon|optional|extras?)/i.test(g.slice(a+1,b).trim())?"c":"r";
  const c=g.slice(b+1).split(";").map(x=>{const e=x.lastIndexOf("="),n=(e<0?x:x.slice(0,e)).trim();return n?[n,e<0?0:Math.max(0,Math.round(+x.slice(e+1).replace(/[^\d.]/g,"")||0))]:null}).filter(Boolean);
  return c.length?{t:title,k:kind,c}:null}).filter(Boolean)}
const optsText=o=>(o||[]).map(g=>g.t+":"+(g.k==="c"?"c":"r")+":"+g.c.map(c=>c[0]+"="+c[1]).join(";")).join("||");
const nk=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function csvToItems(k,rows){
  const eats=k==="eats",res={items:[],errors:[],newCats:[],added:0,updated:0};
  if(rows.length<2){res.errors.push("The file has no data rows.");return res}
  const m=csvMap(rows[0]);if(m.name===undefined){res.errors.push("No \"name\" column found in the first row.");return res}
  const cats=eats?D.eatCats:D.suppCats,seen=new Set();
  rows.slice(1).forEach((r,ri)=>{
    const g=f=>m[f]===undefined?undefined:String(r[m[f]]??"").trim(),line=ri+2,name=g("name");
    if(!name){res.errors.push("Row "+line+": no name, skipped");return}
    const priceRaw=g("price");let p=priceRaw===undefined?undefined:Math.round(+String(priceRaw).replace(/[^\d.]/g,""));
    if(priceRaw!==undefined&&priceRaw!==""&&(!/\d/.test(priceRaw)||!isFinite(p))){res.errors.push("Row "+line+" ("+name+"): price is not a number, skipped");return}
    const id=g("id"),ex=D[k].find(x=>(id&&x.id===id)||(!id&&nk(x.n)===nk(name)));
    if(!ex&&(p===undefined||isNaN(p))){res.errors.push("Row "+line+" ("+name+"): new item needs a price, skipped");return}
    const e=ex?JSON.parse(JSON.stringify(ex)):(eats?{id:"e"+Date.now().toString(36)+ri,cat:cats[0]||"",n:"",p:0,d:"",img:"",imgs:[],i:"sandwich",o:[]}:{id:"p"+Date.now().toString(36)+ri,g:cats[0]||"",n:"",b:"",p:0,dose:"",r:4.5,rv:0,ing:[],d:"",img:"",imgs:[],i:"leaf"});
    if(!ex&&id)e.id=id;
    e.n=name;if(p!==undefined&&!isNaN(p))e.p=Math.max(0,p);
    const d=g("desc");if(d!==undefined&&(d!==""||!ex))e.d=d;
    const c=g("cat");if(c){if(eats)e.cat=c;else e.g=c;if(!cats.includes(c)&&!res.newCats.includes(c))res.newCats.push(c)}
    const im=g("imgs");if(im){e.imgs=im.split(/[\s|;]+/).filter(u=>/^(https?:\/\/|\/|img\/|data:image)/i.test(u));e.img=e.imgs[0]||""}
    else{if(!Array.isArray(e.imgs))e.imgs=e.img?[e.img]:[]}
    const st=csvStatus(g("status"));if(st){delete e.hide;delete e.out;delete e.soon;if(st==="hide")e.hide=1;if(st==="out")e.out=1;if(st==="soon"&&eats)e.soon=1}
    if(eats){const o=g("opts");if(o!==undefined&&o!=="")e.o=csvOpts(o)}
    else{const b=g("brand");if(b)e.b=b;
      const ds=g("dose");if(ds!==undefined&&(ds!==""||!ex))e.dose=ds;
      const ig=g("ing");if(ig!==undefined&&(ig!==""||!ex))e.ing=ig.split(/[;|,]/).map(x=>x.trim()).filter(Boolean);
      const ra=g("rating");if(ra)e.r=Math.min(5,Math.max(0,+ra||0));const rv=g("rv");if(rv)e.rv=Math.max(0,Math.round(+rv||0))}
    if(seen.has(e.id)){res.errors.push("Row "+line+" ("+name+"): same item appears twice, skipped");return}
    seen.add(e.id);ex?res.updated++:res.added++;res.items.push(e)});
  return res;
}
async function csvImport(k,inp){
  const f=inp.files[0];inp.value="";if(!f)return;
  try{
    const res=csvToItems(k,csvParse(await f.text()));
    if(!res.items.length){alert("Nothing to import.\n\n"+res.errors.slice(0,8).join("\n"));return}
    const msg="Import "+res.items.length+" items?\n\n• "+res.added+" new\n• "+res.updated+" updated (matched by id or name)"+(res.newCats.length?"\n• New categories will be added: "+res.newCats.join(", "):"")+(res.errors.length?"\n\nSkipped ("+res.errors.length+"):\n"+res.errors.slice(0,6).join("\n")+(res.errors.length>6?"\n…":""):"");
    if(!confirm(msg))return;
    toast("Importing…");
    let top=Math.max(0,...Object.values(SORT).map(Number).filter(isFinite));
    const rows=res.items.map(e=>{if(SORT[e.id]===undefined)SORT[e.id]=++top;return{id:e.id,kind:k==="eats"?"eat":"supp",data:e,sort:SORT[e.id],updated_at:new Date().toISOString()}});
    for(let i=0;i<rows.length;i+=50){const {error}=await sb.from("items").upsert(rows.slice(i,i+50));if(error)throw error}
    if(res.newCats.length){const key=k==="eats"?"eatCats":"suppCats",all=[...(k==="eats"?D.eatCats:D.suppCats),...res.newCats];if(await setting(key,all)){k==="eats"?D.eatCats=all:D.suppCats=all}}
    res.items.forEach(e=>{const L=D[k],i=L.findIndex(x=>x.id===e.id);i<0?L.push(e):L[i]=e});
    draw();toast("Imported "+res.items.length+" items. Live on the site now.");
  }catch(e){toast("Import failed: "+(e.message||e))}
}
function csvDownload(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+text],{type:"text/csv;charset=utf-8"}));a.download=name;a.click()}
const csvLine=a=>a.map(csvQ).join(",");
function csvTemplate(k){
  const eats=k==="eats",c=(eats?D.eatCats:D.suppCats)[0]||"Category";
  const L=eats?[["id","name","category","price","description","images","status","options"],
    ["","Classic Energy",c,800,"Cold-pressed tiger nut, naturally sweet and filling.","https://example.com/a.jpg|https://example.com/b.jpg","available","Size:r:Regular (500ml)=0;Large (750ml)=300||Add-ons:c:Honey=100;Dates=150"],
    ["","Power Start Combo",c,1800,"Toast, eggs and a tiger nut drink.","","available",""]]
   :[["id","name","brand","category","price","dosage","ingredients","rating","reviews","description","images","status"],
    ["","Vitamin C + Zinc","Fidson",c,1500,"1 tablet daily","Vitamin C;Zinc",4.6,128,"Immune support and faster recovery.","https://example.com/a.jpg|https://example.com/b.jpg","available"],
    ["","Omega 3 Fish Oil 1000mg","Nature's Field",c,2800,"1 softgel daily","Omega 3;Fish oil",4.8,212,"Fish oil that supports heart and brain health.","","available"]];
  csvDownload("smartyhub-"+k+"-template.csv",L.map(csvLine).join("\r\n"));
  toast("Template downloaded. Fill it in Excel or Google Sheets, save as CSV, then Import.");
}
function csvExport(k){
  const eats=k==="eats",st=x=>x.hide?"hidden":x.soon?"soon":x.out?"out":"available",im=x=>(x.imgs&&x.imgs.length?x.imgs:(x.img?[x.img]:[])).join("|");
  const L=eats?[["id","name","category","price","description","images","status","options"],...D.eats.map(x=>[x.id,x.n,x.cat,x.p,x.d,im(x),st(x),optsText(x.o)])]
   :[["id","name","brand","category","price","dosage","ingredients","rating","reviews","description","images","status"],...D.supps.map(x=>[x.id,x.n,x.b||"",x.g,x.p,x.dose,(x.ing||[]).join(";"),x.r,x.rv,x.d,im(x),st(x)])];
  csvDownload("smartyhub-"+k+".csv",L.map(csvLine).join("\r\n"));
}

async function seed(c){
  if(!Array.isArray(c.eats)||!Array.isArray(c.supps))throw new Error("Not a valid catalog");
  const rows=[...c.eats.map((x,i)=>({id:x.id,kind:"eat",data:x,sort:i})),...c.supps.map((x,i)=>({id:x.id,kind:"supp",data:x,sort:1000+i}))];
  const {error}=await sb.from("items").upsert(rows);if(error)throw error;
  for(const k of["eatCats","suppCats","hero"])if(c[k])await setting(k,c[k]);

  :k==="riders"?`<div class="blk"><h3>Rider details</h3><label>Full name</label><input name="name" required value="${esc(x.name)}" placeholder="e.g. Tunde Bello"/><label>WhatsApp number</label><input name="phone" type="tel" inputmode="tel" required value="${esc(x.phone)}" placeholder="08012345678"/></div>
    <div class="blk"><h3>Coverage</h3><label>Zone or area (optional)</label><input name="zone" value="${esc(x.zone||"")}" placeholder="e.g. Ikeja, Alimosho"/></div>`
  :`<div class="blk"><h3>Zone details</h3><label>Area name</label><input name="name" required value="${esc(x.name)}" placeholder="e.g. Ikeja"/><label>Delivery fee (₦)</label><input name="fee" type="number" min="0" step="50" inputmode="numeric" value="${x.fee??""}" placeholder="Leave empty to confirm on WhatsApp"/></div>`;
  $("#sheet").innerHTML=`<div class="scrim fixed inset-0 z-50 flex items-end justify-center bg-black/40 sm:items-center sm:p-4" onclick="if(event.target===this)closeSheet()">
  <form id="pf" onsubmit="event.preventDefault();pSave()" class="drawer flex max-h-[92vh] w-full max-w-lg flex-col overflow-hidden rounded-t-3xl bg-white shadow-2xl sm:rounded-3xl">
  <div class="mx-auto mt-2 h-1.5 w-10 rounded-full bg-neutral-300 sm:hidden"></div>
  <div class="flex items-center justify-between px-5 py-3"><h2 class="text-lg font-extrabold">${i>=0?"Edit":"Add"} ${PT[k]}</h2><button type="button" onclick="closeSheet()" class="rounded-full bg-neutral-100 p-2" aria-label="Close">${X}</button></div>
  <div class="overflow-y-auto px-5 pb-4">${blocks}${i>=0&&k!=="zones"?'<p class="mt-3 text-xs text-neutral-500">Renaming only affects new orders. Orders already assigned keep the old name.</p>':""}</div>
  <div class="flex gap-2 border-t border-neutral-100 px-5 py-3">${i>=0?'<button type="button" class="btn border border-red-300 text-red-600" onclick="pDel()">Delete</button>':'<button type="button" class="btn border border-neutral-300" onclick="closeSheet()">Cancel</button>'}<button class="btn flex-1 bg-g2 py-3 text-white">Save</button></div></form></div>`;
}
async function pSave(){
  const f=$("#pf"),name=f.name.value.trim(),arr=[...D[PK]];let rec;
  if(D[PK].some((x,i)=>i!==PI&&x.name.toLowerCase()===name.toLowerCase()))return toast("That name already exists");
  if(PK==="zones"){const v=f.fee.value.trim();rec={name,fee:v===""?null:Math.max(0,Math.round(+v)||0)}}
  else{const phone=f.phone.value.trim();if(wn(phone).length<11)return toast("Enter a valid WhatsApp number, e.g. 08012345678");
    rec=PK==="kitchens"?{name,phone,address:f.address.value.trim()}:{name,phone,zone:f.zone.value.trim()}}
  PI>=0?arr[PI]=rec:arr.push(rec);
  const btn=f.querySelector("button.flex-1");btn.disabled=true;btn.textContent="Saving…";
  if(await setting(PK,arr)){D[PK]=arr;closeSheet();draw();toast("Saved")}else{btn.disabled=false;btn.textContent="Save"}
}
async function pDel(){
  if(!confirm("Delete this "+PT[PK]+"?"))return;
  const arr=D[PK].filter((_,i)=>i!==PI);
  if(await setting(PK,arr)){D[PK]=arr;closeSheet();draw();toast("Deleted")}
}

init();
</script>
</body>
</html>
