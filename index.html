    const j=await r.json();AU.tok=j.access_token;AU.ref=j.refresh_token;AU.exp=Date.now()+(j.expires_in||3600)*1000;saveAuth();return AU.tok}catch(e){return null}
}
function authClear(){AU={tok:null,ref:null,exp:0,user:null};try{localStorage.removeItem("sho-auth")}catch(e){}drawMenu()}
async function authUser(){
  const C=SBC(),t=await authToken();if(!C||!t)return;
  try{const r=await fetch(C.url+"/auth/v1/user",{headers:{apikey:C.key,Authorization:"Bearer "+t}});
    if(!r.ok){authClear();return}
    const u=await r.json(),m=u.user_metadata||{};
    AU.user={id:u.id,email:u.email||"",name:m.full_name||m.name||(u.email||"").split("@")[0]||"there",pic:m.avatar_url||m.picture||""};drawMenu();
    if(AU.fresh){AU.fresh=false;let nx=null;try{nx=sessionStorage.getItem("sho-after");sessionStorage.removeItem("sho-after")}catch(e){}
      toast("Signed in. Welcome, "+AU.user.name.split(" ")[0]);if(nx==="orders")openOrders();else if(nx==="offers")openOffers()}
  }catch(e){}
}
function signIn(p,after){const C=SBC();if(!C||(PROV&&PROV[p]===false)){toast("Sign-in with "+(p==="apple"?"Apple":"Google")+" isn't switched on yet");return}
  try{if(after)sessionStorage.setItem("sho-after",after)}catch(e){}
  location.href=C.url+"/auth/v1/authorize?provider="+p+"&redirect_to="+encodeURIComponent(location.origin+location.pathname)}
async function signOut(){const C=SBC();try{if(C&&AU.tok)await fetch(C.url+"/auth/v1/logout",{method:"POST",headers:{apikey:C.key,Authorization:"Bearer "+AU.tok}})}catch(e){}authClear();toast("Signed out")}

function openMenu(o){
  const m=$("#menu");m.classList.toggle("-translate-x-full",!o);
  if(o){drawMenu();$("#ov").classList.remove("hidden")}
  else if($("#drawer").classList.contains("translate-x-full")&&$("#modal").classList.contains("hidden"))$("#ov").classList.add("hidden");
  document.body.style.overflow=o?"hidden":"";const b=document.querySelector("[data-a=menu]");if(b)b.setAttribute("aria-expanded",!!o);
}
function drawMenu(){
  drawHdr();const m=$("#menu");if(!m)return;const u=AU.user;
  const L=(v,ic,t,sub)=>`<button data-a="mn" data-v="${v}" class="pill flex w-full items-center gap-3 rounded-2xl px-3 py-2.5 text-left font-semibold hover:bg-neutral-50"><span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-green-50 text-g2">${svgI(IC[ic])}</span><span class="min-w-0"><span class="block">${t}</span>${sub?`<span class="block text-xs font-normal text-neutral-500">${sub}</span>`:""}</span></button>`;
  m.innerHTML=`<div class="flex items-center justify-between border-b border-neutral-100 px-5 py-4"><p class="font-serif text-xl font-bold">Menu</p><button data-a="menux" class="rounded-full bg-neutral-100 p-2 hover:bg-neutral-200" aria-label="Close menu">${svgI(IC.x)}</button></div>
  <div class="flex-1 overflow-y-auto px-3 py-4">
    <div class="mx-2 mb-4 rounded-2xl bg-green-50 p-4">${u?`<div class="flex items-center gap-3">${u.pic?`<img src="${escH(u.pic)}" alt="" referrerpolicy="no-referrer" class="h-11 w-11 rounded-full object-cover"/>`:`<span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-g2 font-bold text-white">${escH((u.name||"?")[0].toUpperCase())}</span>`}<div class="min-w-0"><p class="truncate font-bold">${escH(u.name)}</p><p class="truncate text-xs text-neutral-500">${escH(u.email)}</p></div></div>`:`<p class="font-bold">Sign in to track your orders</p><p class="mb-3 mt-1 text-sm text-neutral-600">Follow your delivery and unlock member offers. No password needed.</p>${signBtns("")}`}</div>
    ${L("eats","food","Breakfast &amp; Eats")}${L("supp","leaf","Supplements")}
    ${L("orders","box","My orders",u?"Track your delivery":"Log in to track your delivery")}${L("offers","tag","Offers &amp; coupons",u?"Promo codes and member deals":"Log in to see offers")}${L("dinfo","truck","Delivery &amp; hours","Areas, fees and times")}${L("menus","img","Printed menus")}
    <div class="my-3 border-t border-neutral-100"></div>
    ${L("wa","chat","Chat on WhatsApp")}${L("ig","insta","Instagram")}
  </div>
  ${u?`<div class="border-t border-neutral-100 p-4"><button data-a="signout" class="pill flex w-full items-center justify-center gap-2 rounded-full border border-neutral-200 py-2.5 text-sm font-bold hover:border-neutral-400">${svgI(IC.out,"h-4 w-4")}Sign out</button></div>`:""}`;
}

/* delivery info */
function deliveryHtml(){
  const z=ZONES.map(x=>`<li class="flex justify-between gap-3 border-b border-neutral-100 py-2"><span>${escH(x.name)}</span><span class="font-semibold">${typeof x.fee==="number"?fmt(x.fee):"Confirmed on WhatsApp"}</span></li>`).join("");
  const row=(t,v)=>v?`<div class="rounded-2xl bg-neutral-50 p-3 text-sm"><p class="font-bold">${t}</p><p class="whitespace-pre-line text-neutral-600">${escH(v)}</p></div>`:"";
  return `<ul class="text-sm">${z}</ul><div class="mt-3 space-y-2">${row("Opening hours",INFO.hours)}${row("Order cut-off",INFO.cutoff)}${row("Good to know",INFO.note)}</div>`;
}
function openDelivery(){modal(`<div class="flex items-start justify-between"><h2 class="font-serif text-2xl font-bold">Delivery &amp; hours</h2>${xBtn}</div><div class="mt-3">${deliveryHtml()}</div>`)}

/* offers */
async function openOffers(){
  if(!AU.user){openSignIn("offers","Log in to see offers","Sign in to see promo codes and member-only deals.");return}
  modal(`<div class="flex items-start justify-between"><h2 class="font-serif text-2xl font-bold">Offers &amp; coupons</h2>${xBtn}</div><p class="py-10 text-center text-neutral-500">Loading offers…</p>`);
  let j=null;try{const r=await rpc("list_offers");if(r.ok)j=r.j}catch(e){}
  const L=j&&Array.isArray(j.offers)?j.offers:[],lk=j&&j.locked||0;
  const card=o=>`<div class="rounded-2xl border border-dashed border-g3 bg-green-50/60 p-4"><div class="flex items-start justify-between gap-2"><div><p class="font-bold">${escH(o.title||o.code)}</p>${o.description?`<p class="mt-0.5 text-sm text-neutral-600">${escH(o.description)}</p>`:""}</div>${o.members_only?'<span class="shrink-0 rounded-full bg-g2 px-2 py-0.5 text-[10px] font-bold text-white">MEMBERS</span>':""}</div>
    <p class="mt-2 text-sm font-semibold text-g1">${o.kind==="percent"?o.value+"% off":fmt(o.value)+" off"}${o.min_order>0?" · orders from "+fmt(o.min_order):""}${o.expires_at?" · ends "+new Date(o.expires_at).toLocaleDateString("en-NG",{day:"numeric",month:"short"}):""}</p>
    <div class="mt-3 flex items-center justify-between gap-2"><code class="rounded-lg bg-white px-3 py-1.5 text-sm font-extrabold tracking-wider">${escH(o.code)}</code><button data-a="usecode" data-v="${escH(o.code)}" class="pill rounded-full bg-g2 px-4 py-2 text-sm font-bold text-white hover:bg-g1">Use this code</button></div></div>`;
  modal(`<div class="flex items-start justify-between"><h2 class="font-serif text-2xl font-bold">Offers &amp; coupons</h2>${xBtn}</div>
  <div class="mt-4 space-y-3">${L.length?L.map(card).join(""):'<p class="py-8 text-center text-neutral-500">No offers right now. Check back soon.</p>'}
  ${lk>0&&!AU.user?`<div class="rounded-2xl bg-neutral-50 p-4"><p class="font-bold">${lk} more offer${lk>1?"s":""} for members</p><p class="mb-3 mt-1 text-sm text-neutral-600">Sign in to unlock them. It takes one tap.</p>${signBtns("offers")}</div>`:""}</div>`);
}

/* orders */
const STEPS=[["new","Received"],["preparing","Preparing"],["out","On the way"],["delivered","Delivered"]];
const STX={new:"We have your order",preparing:"Your order is being prepared",out:"Your order is on its way",delivered:"Delivered. Enjoy!",cancelled:"This order was cancelled"};
function ordHtml(){
  if(!ORDS.length)return '<p class="py-10 text-center text-neutral-500">No orders yet. When you order while signed in, it shows up here.</p>';
  return ORDS.map((o,n)=>{const i=STEPS.findIndex(x=>x[0]===o.status),can=o.status==="cancelled";
    return `<div class="rounded-2xl border border-neutral-200 p-4"><div class="flex items-start justify-between gap-2"><div><p class="font-extrabold">${escH(o.ref)}</p><p class="text-xs text-neutral-500">${new Date(o.created_at).toLocaleString("en-NG",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}</p></div><p class="font-extrabold text-g2">${fmt(o.total||0)}</p></div>
    <p class="mt-3 text-sm font-semibold ${can?"text-red-600":"text-g1"}">${STX[o.status]||escH(o.status)}</p>
    ${can?"":`<div class="mt-2 flex gap-1.5">${STEPS.map((s,k)=>`<div class="flex-1 text-center"><span class="block h-2 rounded-full ${k<=i?"bg-g2":"bg-neutral-200"}"></span><span class="mt-1 block text-[10px] ${k<=i?"font-bold text-g1":"text-neutral-400"}">${s[1]}</span></div>`).join("")}</div>`}
    <ul class="mt-3 list-disc pl-5 text-sm text-neutral-600">${(o.items||[]).map(it=>`<li>${it.q} × ${escH(it.n)}${it.o?" ("+escH(it.o)+")":""}</li>`).join("")}</ul>
    ${o.discount>0?`<p class="mt-1 text-xs text-g2">Saved ${fmt(o.discount)}${o.coupon?" with "+escH(o.coupon):""}</p>`:""}
    <div class="mt-3 flex gap-2"><button data-a="reorder" data-v="${n}" class="pill flex-1 rounded-full bg-g2 py-2.5 text-sm font-bold text-white hover:bg-g1">Order again</button><a href="https://wa.me/${WA}?text=${encodeURIComponent("Hi SmartyHub, about my order "+o.ref)}" target="_blank" rel="noopener" class="pill rounded-full border border-neutral-200 px-4 py-2.5 text-sm font-bold hover:border-g3">Help</a></div></div>`}).join("");
}
async function loadOrders(quiet){
  const C=SBC(),t=await authToken();
  if(!C||!t){if(!quiet)modal(`<div class="flex justify-end">${xBtn}</div><div class="py-2 text-center"><h2 class="font-serif text-2xl font-bold">Log in to track your orders</h2><p class="mb-4 mt-2 text-neutral-600">Sign in to see where your order is and order again in one tap.</p>${signBtns("orders")}</div>`);return}
  try{const r=await fetch(C.url+"/rest/v1/orders?select=ref,status,created_at,total,discount,coupon,items&order=created_at.desc&limit=15",{headers:{apikey:C.key,Authorization:"Bearer "+t},cache:"no-store"});
    if(!r.ok)throw new Error("x");ORDS=await r.json();
    const box=$("#ordl");if(box)box.innerHTML=ordHtml();else if(!quiet)modal(`<div class="flex items-start justify-between"><h2 class="font-serif text-2xl font-bold">My orders</h2>${xBtn}</div><div id="ordl" class="mt-4 space-y-3">${ordHtml()}</div>`)}
  catch(e){if(!quiet)modal(`<div class="flex items-start justify-between"><h2 class="font-serif text-2xl font-bold">My orders</h2>${xBtn}</div><p class="py-8 text-center text-neutral-500">Order tracking isn't switched on yet. Please chat with us on WhatsApp for your order status.</p>`)}
}
function openOrders(){
  if(!AU.tok){loadOrders();return}
  modal(`<div class="flex items-start justify-between"><h2 class="font-serif text-2xl font-bold">My orders</h2>${xBtn}</div><div id="ordl" class="mt-4 space-y-3"><p class="py-10 text-center text-neutral-500">Loading…</p></div>`);
  loadOrders();clearInterval(ORT);ORT=setInterval(()=>{if($("#ordl")&&!document.hidden)loadOrders(true);else if(!$("#ordl"))clearInterval(ORT)},30000);
}
function reorder(n){
  const o=ORDS[n];if(!o)return;let ok=0,miss=0,changed=false;
  (o.items||[]).forEach(it=>{
    const e=EATS.find(x=>x.n===it.n&&!x.hide&&!x.soon&&!x.out),sp=e?null:SUPP.find(x=>x.n===it.n&&!x.hide&&!x.out);
    if(!e&&!sp){miss++;return}
    const k=e?e.id+"|"+String(it.o||"").split(", ").filter(Boolean).join():sp.id,p=e?(it.p||e.p):sp.p;
    if(!e&&sp.p!==it.p)changed=true;
    const f=S.cart.find(x=>x.k===k);f?f.q+=it.q:S.cart.push(e?{k,n:e.n,o:it.o||"",p,q:it.q,food:1}:{k,n:sp.n,p,q:it.q});ok++});
  save();badge(1);drawCart();modal();
  if(ok){openCart(true);toast(ok+" item"+(ok>1?"s":"")+" added"+(miss?` · ${miss} no longer available`:"")+". Check prices in your cart.")}
  else toast("Those items are no longer on the menu")
}

/* coupons */
function tot(){
  const z=($("#co")&&$("#co").zone&&$("#co").zone.value)||"",fee=feeOf(z),dis=CP?CP.discount:0;
  $("#fe").textContent=feeTxt(z);$("#to").textContent=fmt(Math.max(0,sub()+fee-dis));
  const r=$("#dsr");if(r){r.classList.toggle("hidden",!CP);r.classList.toggle("flex",!!CP);if(CP){$("#dsl").textContent="Discount ("+CP.code+")";$("#dsv").textContent="−"+fmt(CP.discount)}}
}
async function cpnApply(){
  const i=$("#cpn"),m=$("#cpm"),code=(i.value||"").trim(),bad=t=>{CP=null;m.textContent=t;m.className="mt-1 text-xs text-red-600";tot()};
  if(!code)return bad("Enter a code first.");
  if(!SBC())return bad("Coupons aren't available right now.");
  m.textContent="Checking…";m.className="mt-1 text-xs text-neutral-500";
  try{const r=await rpc("check_coupon",{p_code:code,p_subtotal:sub()}),j=r.j;
    if(r.ok&&j&&j.ok){CP={code:j.code,discount:j.discount,title:j.title||""};m.textContent="Applied"+(j.title?": "+j.title:"")+". You save "+fmt(j.discount);m.className="mt-1 text-xs font-semibold text-g2";tot()}
    else bad((j&&j.msg)||"That code could not be applied.")}
  catch(e){bad("Could not check the code. Try again.")}
}

/* ---------- EVENTS ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,v=t.dataset.v;
  if(a==="eco"){S.eco=v;S.q="";$("#q").value="";history.replaceState(null,"","#"+v);render();scrollTo({top:0})}
  else if(a==="cat"){S.cat=v;render()}
  else if(a==="goal"){S.goal=v;render();$("#filters").classList.remove("hidden")}
  else if(a==="ing"){S.ing.has(v)?S.ing.delete(v):S.ing.add(v);render();$("#filters").classList.remove("hidden")}
  else if(a==="reset"){S.goal="All";S.max=8000;S.min=0;S.ing.clear();render()}
  else if(a==="pg"){S.pg=(S.pg||1)+ +v;S.eco==="eats"?drawEats():drawSupp();const g=$("#grid");scrollTo({top:Math.max(0,g.getBoundingClientRect().top+scrollY-150),behavior:"smooth"})}
  else if(a==="gp")galStep(-1);
  else if(a==="gn")galStep(1);
  else if(a==="gt")galSet(+v);
  else if(a==="lb"){if(Date.now()-GL.sw>350)lbOpen(+v)}
  else if(a==="lbx")lbClose();
  else if(a==="lbp")lbStep(-1);
  else if(a==="lbn")lbStep(1);
  else if(a==="tf")$("#filters").classList.toggle("hidden");
  else if(a==="custom")customModal(v);
  else if(a==="qv")quickView(v);
  else if(a==="addp"){const x=SUPP.find(s=>s.id===v);addItem({k:x.id,n:x.n,p:x.p,q:1});if(t.dataset.c)modal()}
  else if(a==="mq"){const f=$("#cf");f.dataset.q=Math.max(1,+f.dataset.q+ +v);$("#mqn").textContent=f.dataset.q;calc()}
  else if(a==="madd"){const f=$("#cf"),x=EATS.find(s=>s.id===f.dataset.id),o=[...f.querySelectorAll("input:checked")].map(i=>i.value);
    addItem({k:x.id+"|"+o.join(),n:x.n,o:o.join(", "),p:calc(),q:+f.dataset.q,food:1});modal()}
  else if(a==="cart")openCart(true);
  else if(a==="close"){openCart(false);modal();openMenu(false)}
  else if(a==="mclose")modal();
  else if(a==="img")modal(`<div class="flex justify-end"><button data-a="mclose" class="ml-3 shrink-0 rounded-full bg-neutral-100 p-2 hover:bg-neutral-200" aria-label="Close"><i data-lucide="x" class="h-5 w-5"></i></button></div><img src="${v}" alt="Menu" class="mx-auto mt-2 h-auto w-full rounded-2xl"/>`);
  else if(a==="inc"||a==="dec"){const i=S.cart[v];i.q+=a==="inc"?1:-1;if(i.q<1)S.cart.splice(v,1);save();badge();drawCart()}
  else if(a==="checkout")checkout();
  else if(a==="menu")openMenu(true);
  else if(a==="menux")openMenu(false);
  else if(a==="mn"){openMenu(false);
    if(v==="eats"||v==="supp"){S.eco=v;S.q="";$("#q").value="";history.replaceState(null,"","#"+v);render();scrollTo({top:0})}
    else if(v==="orders")openOrders();else if(v==="offers")openOffers();else if(v==="dinfo")openDelivery();
    else if(v==="menus"){S.eco="eats";render();setTimeout(()=>{const e=$("#fullmenu");if(e)e.scrollIntoView({behavior:"smooth"})},80)}
    else if(v==="wa")window.open("https://wa.me/"+WA,"_blank");else if(v==="ig")window.open("https://instagram.com/smartyhuborganic","_blank")}
  else if(a==="signin")signIn(v,t.dataset.n);
  else if(a==="signsheet")openSignIn("");
  else if(a==="signout"){openMenu(false);signOut()}
  else if(a==="cpn")cpnApply();
  else if(a==="usecode"){S.pendingCode=v;modal();toast("Code "+v+" saved. It is applied at checkout.");if(S.cart.length)openCart(true)}
  else if(a==="reorder")reorder(+v);
});
document.addEventListener("input",e=>{
  if(e.target.closest("#cf"))calc();
  if(e.target.name==="zone")tot();
  if(e.target.id==="q"){S.q=e.target.value;S.eco==="eats"?drawEats():drawSupp()}
  if(e.target.id==="mx"){S.max=+e.target.value;$("#mxv").textContent=fmt(S.max);drawSupp()}
  if(e.target.id==="mn"){S.min=+e.target.value;drawSupp()}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("article[role=button]")){e.preventDefault();e.target.click()}});
document.addEventListener("submit",e=>{if(e.target.id==="co"){e.preventDefault();done(Object.fromEntries(new FormData(e.target)))}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){openCart(false);modal();openMenu(false)}});
addEventListener("hashchange",()=>{const s=location.hash==="#supp"?"supp":"eats";if(s!==S.eco){S.eco=s;render()}});

/* ---------- CATALOG (managed from admin.html) ---------- */
async function sbCatalog(){
  const C=window.SHO_SB;if(!C||!C.url||!C.key||/YOUR/.test(C.url+C.key))return null;
  try{
    const h={apikey:C.key,Authorization:"Bearer "+C.key};
    const [a,b]=await Promise.all([fetch(C.url+"/rest/v1/items?select=kind,data&order=sort.asc",{headers:h,cache:"no-store"}),fetch(C.url+"/rest/v1/settings?select=key,value",{headers:h,cache:"no-store"})]);
    if(!a.ok||!b.ok)return null;
    const it=await a.json(),st=Object.fromEntries((await b.json()).map(r=>[r.key,r.value]));
    if(Array.isArray(st.zones)&&st.zones.length)ZONES=st.zones;
    if(st.info&&typeof st.info==="object")INFO=st.info;
    if(!it.length)return null;
    return {eats:it.filter(i=>i.kind==="eat").map(i=>i.data),supps:it.filter(i=>i.kind==="supp").map(i=>i.data),eatCats:st.eatCats,suppCats:st.suppCats,hero:st.hero};
  }catch(e){return null}
}
async function loadCatalog(){
  let c=null,prev=/[?&]preview/.test(location.search);
  try{
    if(prev)c=JSON.parse(localStorage.getItem("sho-preview")||"null");
    if(!c)c=await sbCatalog();
    if(!c){const r=await fetch("catalog.json",{cache:"no-cache"});if(r.ok)c=await r.json()}
  }catch(e){}
  if(c&&Array.isArray(c.eats)&&Array.isArray(c.supps)){
    EATS=c.eats;SUPP=c.supps;
    if(c.eatCats)ECATS=["All",...c.eatCats];
    if(c.suppCats)GOALS=["All",...c.suppCats];
    if(c.hero&&c.hero.length)HERO_SLIDES=c.hero;
    INGS=[...new Set(SUPP.flatMap(x=>x.ing||[]))].sort();
  }
  if(prev){const b=document.createElement("div");b.textContent="Preview mode: not live yet";b.className="fixed left-0 right-0 top-0 z-[70] bg-amber-400 py-1 text-center text-xs font-bold";document.body.appendChild(b)}
}
drawHdr();authInit();
loadCatalog().then(()=>{render();drawCart();drawMenu()});
</script>
