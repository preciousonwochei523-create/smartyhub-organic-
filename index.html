  <div class="mt-4 space-y-4">${L.map((nm,i)=>`<div class="rounded-2xl border border-neutral-200 p-4"><p class="font-bold">${escH(nm)}</p><div class="mt-1 flex" id="sr${i}">${starRow(i,RS.v[i])}</div></div>`).join("")}</div>
  <button data-a="rsubmit" class="pill mt-5 w-full rounded-full bg-g2 py-3 text-sm font-bold text-white hover:bg-g1">Submit rating</button>`);
}
function starSet(t){if(!RS)return;const i=+t.dataset.i,v=+t.dataset.v;RS.v[i]=v;const b=$("#sr"+i);if(b)b.innerHTML=starRow(i,v)}
async function rateSubmit(){
  if(!RS)return;const todo=RS.names.map((nm,i)=>[nm,RS.v[i]]).filter(x=>x[1]>0);
  if(!todo.length){toast("Tap the stars to rate first");return}
  let bad=null;
  for(const [nm,v] of todo){try{const r=await rpc("submit_rating",{p_ref:RS.ref,p_item:nm,p_stars:v,p_comment:""});
    if(r.ok&&r.j&&r.j.ok)MYR[RS.ref+"|"+nm]=v;else bad=(r.j&&r.j.msg)||"Could not save your rating"}catch(e){bad="Could not save your rating"}}
  if(bad){toast(bad);return}
  RS=null;modal();toast("Thanks for rating!");loadRatings();openOrders();
}

function openOrders(){
  if(!AU.tok){loadOrders();return}
  modal(`<div class="flex items-start justify-between"><h2 class="font-serif text-2xl font-bold">My orders</h2>${xBtn}</div><div id="ordl" class="mt-4 space-y-3"><p class="py-10 text-center text-neutral-500">Loading…</p></div>${trackBox()}`);
  loadOrders();clearInterval(ORT);ORT=setInterval(()=>{if($("#ordl")&&!document.hidden)loadOrders(true);else if(!$("#ordl"))clearInterval(ORT)},30000);

function reorder(n){
  const o=ORDS[n];if(!o)return;let ok=0,miss=0,changed=false;
  (o.items||[]).forEach(it=>{
    const e=EATS.find(x=>x.n===it.n&&!x.hide&&!x.soon&&!x.out),sp=e?null:SUPP.find(x=>x.n===it.n&&!x.hide&&!x.out);
    if(!e&&!sp){miss++;return}
    const k=e?e.id+"|"+String(it.o||"").split(", ").filter(Boolean).join():sp.id,p=e?(it.p||e.p):sp.p;
    if(!e&&sp.p!==it.p)changed=true;
    const f=S.cart.find(x=>x.k===k);f?f.q+=it.q:S.cart.push(e?{k,n:e.n,o:it.o||"",p,q:it.q,food:1}:{k,n:sp.n,p,q:it.q});ok++});
  save();badge(1);drawCart();modal();
  if(ok){openCart(true);toast(ok+" item"+(ok>1?"s":"")+" added"+(miss?` · ${miss} no longer available`:"")+". Check prices in your cart.")}
  else toast("Those items are no longer on the menu")
}

/* coupons */
function tot(){
  const dis=CP?CP.discount:0;
  $("#fe").textContent="Free";$("#to").textContent=fmt(Math.max(0,sub()-dis));
  const r=$("#dsr");if(r){r.classList.toggle("hidden",!CP);r.classList.toggle("flex",!!CP);if(CP){$("#dsl").textContent="Discount ("+CP.code+")";$("#dsv").textContent="−"+fmt(CP.discount)}}
}
async function cpnApply(){
  const i=$("#cpn"),m=$("#cpm"),code=(i.value||"").trim(),bad=t=>{CP=null;m.textContent=t;m.className="mt-1 text-xs text-red-600";tot()};
  if(!code)return bad("Enter a code first.");
  if(!SBC())return bad("Coupons aren't available right now.");
  m.textContent="Checking…";m.className="mt-1 text-xs text-neutral-500";
  try{const r=await rpc("check_coupon",{p_code:code,p_subtotal:cartGroups().length?gsub(couponTarget()):sub()}),j=r.j;
    if(r.ok&&j&&j.ok){CP={code:j.code,discount:j.discount,title:j.title||""};m.textContent="Applied"+(j.title?": "+j.title:"")+". You save "+fmt(j.discount)+(split()?" on your "+couponTarget().label.toLowerCase()+" order":"");m.className="mt-1 text-xs font-semibold text-g2";tot()}
    else bad((j&&j.msg)||"That code could not be applied.")}
  catch(e){bad("Could not check the code. Try again.")}
}

  else if(a==="gp")galStep(-1);
  else if(a==="gn")galStep(1);
  else if(a==="gt")galSet(+v);
  else if(a==="lb"){if(Date.now()-GL.sw>350)lbOpen(+v)}
  else if(a==="lbx")lbClose();
  else if(a==="lbp")lbStep(-1);
  else if(a==="lbn")lbStep(1);
  else if(a==="tf")$("#filters").classList.toggle("hidden");
  else if(a==="custom")customModal(v);
  else if(a==="qv")quickView(v);
  else if(a==="addp"){const x=SUPP.find(s=>s.id===v);addItem({k:x.id,n:x.n,p:x.p,q:1});if(t.dataset.c)modal()}
  else if(a==="mq"){const f=$("#cf");f.dataset.q=Math.max(1,+f.dataset.q+ +v);$("#mqn").textContent=f.dataset.q;calc()}
  else if(a==="madd"){const f=$("#cf"),x=EATS.find(s=>s.id===f.dataset.id),o=[...f.querySelectorAll("input:checked")].map(i=>i.value);
    addItem({k:x.id+"|"+o.join(),n:x.n,o:o.join(", "),p:calc(),q:+f.dataset.q,food:1});modal()}
  else if(a==="cart")openCart(true);
  else if(a==="close"){openCart(false);modal();openMenu(false)}
  else if(a==="mclose")modal();
  else if(a==="img")modal(`<div class="flex justify-end"><button data-a="mclose" class="ml-3 shrink-0 rounded-full bg-neutral-100 p-2 hover:bg-neutral-200" aria-label="Close"><i data-lucide="x" class="h-5 w-5"></i></button></div><img src="${v}" alt="Menu" class="mx-auto mt-2 h-auto w-full rounded-2xl"/>`);
  else if(a==="inc"||a==="dec"){const i=S.cart[v];i.q+=a==="inc"?1:-1;if(i.q<1)S.cart.splice(v,1);save();badge();drawCart()}
  else if(a==="checkout")checkout();
  else if(a==="menu")openMenu(true);
  else if(a==="menux")openMenu(false);
  else if(a==="mn"){openMenu(false);
    if(v==="eats"||v==="supp"){S.eco=v;S.q="";$("#q").value="";history.replaceState(null,"","#"+v);render();scrollTo({top:0})}
    else if(v==="orders")openOrders();else if(v==="offers")openOffers();else if(v==="dinfo")openDelivery();
    else if(v==="menus"){S.eco="eats";render();setTimeout(()=>{const e=$("#fullmenu");if(e)e.scrollIntoView({behavior:"smooth"})},80)}
    else if(v==="wa")window.open("https://wa.me/"+WA,"_blank");else if(v==="ig")window.open("https://instagram.com/smartyhuborganic","_blank")}
  else if(a==="profile")openProfile(true);
  else if(a==="profilex")openProfile(false);
  else if(a==="pf"){
    if(v==="orders")openOrders();else if(v==="account")openAccount();else if(v==="offers")openOffers();else if(v==="dinfo")openDelivery();
    else if(v==="menus"){openProfile(false);S.eco="eats";render();setTimeout(()=>{const e=$("#fullmenu");if(e)e.scrollIntoView({behavior:"smooth"})},80)}
    else if(v==="wa")window.open("https://wa.me/"+WA,"_blank");else if(v==="ig")window.open("https://instagram.com/smartyhuborganic","_blank");
    else if(v==="faq")openFaq(true);
    else if(v==="out"){openProfile(false);signOut()}}
  else if(a==="faqx")openFaq(false);
  else if(a==="faqgo"){openFaq(false);if(v==="dinfo")openDelivery();else if(v==="offers")openOffers();else if(v==="orders")openOrders();else if(v==="wa")window.open("https://wa.me/"+WA,"_blank")}
  else if(a==="signin")signIn(v,t.dataset.n);
  else if(a==="signsheet"){openMenu(false);openSignIn(t.dataset.n||"")}
  else if(a==="signup"){openMenu(false);openSignUp(t.dataset.n||"")}

  else if(a==="payonline")payOnline(t);

  else if(a==="cpn")cpnApply();

  else if(a==="reorder")reorder(+v);

});

/* ---------- CATALOG (managed from admin.html) ---------- */
async function sbCatalog(){
  const C=window.SHO_SB;if(!C||!C.url||!C.key||/YOUR/.test(C.url+C.key))return null;
  try{
    const h={apikey:C.key,Authorization:"Bearer "+C.key};
    const [a,b]=await Promise.all([fetch(C.url+"/rest/v1/items?select=kind,data&order=sort.asc",{headers:h,cache:"no-store"}),fetch(C.url+"/rest/v1/settings?select=key,value",{headers:h,cache:"no-store"})]);
    if(!a.ok||!b.ok)return null;
    const it=await a.json(),st=Object.fromEntries((await b.json()).map(r=>[r.key,r.value]));
    if(Array.isArray(st.zones)&&st.zones.length)ZONES=st.zones;
    if(st.info&&typeof st.info==="object")INFO=st.info;
    const pm=(st.payment&&st.payment.mode)||(st.payment&&st.payment.online?"online":"off");ONLINE=pm==="online";PAYSHOW=pm!=="off"||/[?&]paytest=1/.test(location.search);
    if(!it.length)return null;
    return {eats:it.filter(i=>i.kind==="eat").map(i=>i.data),supps:it.filter(i=>i.kind==="supp").map(i=>i.data),eatCats:st.eatCats,suppCats:st.suppCats,hero:st.hero,eatStory:st.eatStory,eatFlyers:st.eatFlyers};
  }catch(e){return null}
}
async function loadCatalog(){
  let c=null,prev=/[?&]preview/.test(location.search);
  try{
    if(prev)c=JSON.parse(localStorage.getItem("sho-preview")||"null");
    if(!c)c=await sbCatalog();
    if(!c){const r=await fetch("catalog.json",{cache:"no-cache"});if(r.ok)c=await r.json()}
  }catch(e){}
  if(c&&Array.isArray(c.eats)&&Array.isArray(c.supps)){
    EATS=c.eats.map(x=>x&&x.cat?{...x,cat:rc(x.cat)}:x);SUPP=c.supps;
    if(c.eatCats)ECATS=["All",...new Set(c.eatCats.map(rc))];
    if(c.suppCats)GOALS=["All",...c.suppCats];
    if(c.hero&&c.hero.length)HERO_SLIDES=c.hero;
    if(Array.isArray(c.eatStory))ESTORY=c.eatStory.filter(x=>x&&(x.title||x.text||x.img));
    if(Array.isArray(c.eatFlyers))EFLYERS=c.eatFlyers.filter(x=>x&&x.img);
    INGS=[...new Set(SUPP.flatMap(x=>x.ing||[]))].sort();
  }
  if(prev){const b=document.createElement("div");b.textContent="Preview mode: not live yet";b.className="fixed left-0 right-0 top-0 z-[70] bg-amber-400 py-1 text-center text-xs font-bold";document.body.appendChild(b)}
}
