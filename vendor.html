<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="theme-color" content="#2E7D32"/>
<title>SmartyHub Partner</title>
<script src="/supabase-config.js"></script>
<style>
:root{--g:#2E7D32;--g1:#1B5E20;--bg:#f6f7f5;--tx:#171717;--mu:#6b7280;--bd:#e5e7eb;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#111513;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2a302c;--card:#1b201d}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header b{font-size:17px}header small{display:block;opacity:.85;font-size:12px}
main{max-width:560px;margin:0 auto;padding:14px 14px 80px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:18px 2px 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input{width:100%;padding:13px 14px;border:1px solid var(--bd);border-radius:14px;font:inherit;background:var(--card);color:var(--tx)}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px 16px;cursor:pointer}
.pri{background:var(--g);color:#fff;width:100%}.pri:disabled{opacity:.5}
.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);padding:8px 12px;font-size:14px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ref{font-weight:800}.mu{color:var(--mu);font-size:13px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:#fef3c7;color:#92400e}
.chip.g{background:#dcfce7;color:#166534}.chip.b{background:#dbeafe;color:#1e40af}
ul{margin:8px 0;padding-left:18px}li{margin:2px 0}
.err{color:#dc2626;font-weight:600;min-height:20px;margin-top:10px;font-size:14px}
.box{background:rgba(46,125,50,.08);border-radius:12px;padding:10px;margin-top:8px;font-size:14px}
a{color:var(--g)}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tab{flex:1;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.tab.on{background:var(--g);color:#fff;border-color:var(--g)}
.sec{margin-top:10px}
.big{font-size:20px;font-weight:800}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;display:none;z-index:9}
</style>
</head>
<body>
<header><div><b id="hn">SmartyHub Partner</b><small id="hs"></small></div><button id="out" class="ghost" style="display:none">Log out</button></header>
<main id="app"></main>
<div id="toast"></div>
<script>
const C=window.SHO_SB||{},URL_=(C.url||"")+"/functions/v1/partner-api",KEY="sh-partner";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>"₦"+Math.round(+n||0).toLocaleString("en-NG");
let T=null,ROLE="",NAME="",seen=null,timer=null,busy=false;
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.token){T=s.token;ROLE=s.kind;NAME=s.name}}catch(e){}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2800)}
async function api(body){
  const r=await fetch(URL_,{method:"POST",headers:{apikey:C.key,Authorization:"Bearer "+C.key,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&body.action!=="login"){logout(j.error);throw new Error("auth")}
  if(!r.ok)throw new Error(j.error||"Something went wrong");return j}
function logout(msg){T=null;try{localStorage.removeItem(KEY)}catch(e){}clearInterval(timer);seen=null;$("#out").style.display="none";$("#hn").textContent="SmartyHub Partner";$("#hs").textContent="";loginView(msg)}
$("#out").onclick=()=>logout();
function loginView(msg,mode){
  mode=mode||"login";const first=mode==="first";
  $("#app").innerHTML=`<div class="card"><div class="tabs"><button class="tab ${first?"":"on"}" data-m="login">Log in</button><button class="tab ${first?"on":""}" data-m="first">First time here</button></div>
  <form id="lf"><label>Phone number (your WhatsApp number)</label><input name="p" type="tel" inputmode="numeric" autocomplete="username" placeholder="08012345678" required/>
  ${first?`<label>Activation code from SmartyHub</label><input name="c" autocapitalize="characters" autocomplete="off" required/>
  <label>Choose your password</label><div style="position:relative"><input name="w" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required style="padding-right:48px"/><button type="button" aria-label="Show password" onclick="const i=this.previousElementSibling,h=i.type==='password';i.type=h?'text':'password';this.setAttribute('aria-label',h?'Hide password':'Show password');this.children[0].style.display=h?'none':'';this.children[1].style.display=h?'':'none'" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;padding:8px;cursor:pointer;color:#6b7280;line-height:0;width:auto"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span><span style="display:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a18.6 18.6 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg></span></button></div>
  <label>Type the password again</label><div style="position:relative"><input name="w2" type="password" autocomplete="new-password" minlength="6" required style="padding-right:48px"/><button type="button" aria-label="Show password" onclick="const i=this.previousElementSibling,h=i.type==='password';i.type=h?'text':'password';this.setAttribute('aria-label',h?'Hide password':'Show password');this.children[0].style.display=h?'none':'';this.children[1].style.display=h?'':'none'" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;padding:8px;cursor:pointer;color:#6b7280;line-height:0;width:auto"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span><span style="display:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a18.6 18.6 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg></span></button></div>`
  :`<label>Password</label><div style="position:relative"><input name="w" type="password" autocomplete="current-password" required style="padding-right:48px"/><button type="button" aria-label="Show password" onclick="const i=this.previousElementSibling,h=i.type==='password';i.type=h?'text':'password';this.setAttribute('aria-label',h?'Hide password':'Show password');this.children[0].style.display=h?'none':'';this.children[1].style.display=h?'':'none'" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;padding:8px;cursor:pointer;color:#6b7280;line-height:0;width:auto"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span><span style="display:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a18.6 18.6 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg></span></button></div>`}
  <p class="err" id="er">${esc(msg||"")}</p><button class="pri" id="lb">${first?"Create my login":"Log in"}</button></form>
  <p class="mu" style="margin-top:12px">${first?"SmartyHub sends you an activation code on WhatsApp. You use it once to create your own password.":"Forgot your password? Message SmartyHub and we will send a new activation code."}</p></div>`;
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>loginView("",b.dataset.m));
  $("#lf").onsubmit=async e=>{e.preventDefault();const f=e.target,b=$("#lb");$("#er").textContent="";
    if(first&&f.w.value!==f.w2.value){$("#er").textContent="The two passwords do not match.";return}
    b.disabled=true;b.textContent="Please wait…";
    try{const j=await api(first?{action:"activate",phone:f.p.value,code:f.c.value,password:f.w.value}:{action:"login",phone:f.p.value,password:f.w.value});
      T=j.token;ROLE=j.kind;NAME=j.name;localStorage.setItem(KEY,JSON.stringify({token:T,kind:ROLE,name:NAME}));start()}
    catch(err){$("#er").textContent=err.message;b.disabled=false;b.textContent=first?"Create my login":"Log in"}}}
const ago=d=>{const m=Math.max(0,Math.round((Date.now()-new Date(d))/60000));return m<1?"just now":m<60?m+" min ago":m<1440?Math.floor(m/60)+" h ago":Math.floor(m/1440)+" d ago"};
function beep(){try{navigator.vibrate&&navigator.vibrate([200,100,200]);const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(()=>{o.stop();a.close()},350)}catch(e){}}
function action(o){
  if(o.status==="new")return ["accept","Accept and call a rider"];
  if(o.status==="preparing"&&!o.ready&&o.rider)return ["ready","Mark shipped and get paid"];
  return null}
function stat(o){
  if(o.status==="new")return '<span class="chip">New</span>';
  if(o.status==="preparing")return o.ready?'<span class="chip b">Shipped</span>':'<span class="chip">Preparing</span>';
  if(o.status==="out")return '<span class="chip b">On the way</span>';
  return '<span class="chip g">Delivered</span>'}
function card(o,i){
  const a=action(o),done=o.status==="delivered";
  const items=`<ul>${o.items.map(x=>`<li><b>${esc(x.q)} ×</b> ${esc(x.n)}${x.o?` <span class="mu">(${esc(x.o)})</span>`:""}</li>`).join("")}</ul>`;
  const rb=o.rider?`<div class="box"><b>Rider:</b> ${esc(o.rider)}${o.rider_phone?` · <a href="tel:${esc(o.rider_phone)}">${esc(o.rider_phone)}</a>`:""}</div>`:(o.status==="preparing"?`<div class="box mu">${o.sent?"Looking for a rider…":"Sending to riders…"}</div>`:"");
  const pb=o.paid?`<div class="box"><b>Paid ✓</b> ${fmt(o.earn)} sent to your bank account.</div>`:(o.ready?`<div class="box mu">Your payment is on its way. It can take a few minutes.</div>`:"");
  return `<div class="card"><div class="row"><div><span class="ref">${esc(o.ref)}</span> ${stat(o)}<div class="mu">${ago(o.created_at)}</div></div><div style="text-align:right"><div class="mu">You earn</div><div class="big">${fmt(o.earn)}</div></div></div>
  ${items}${o.note?`<p class="mu">Note: ${esc(o.note)}</p>`:""}<p class="mu">Area: ${esc(o.zone||"")}</p>${rb}${pb}
  ${a&&!done?`<button class="pri sec" data-i="${i}" data-a="${a[0]}">${a[1]}</button>`:""}</div>`}
let LIST=[];
function render(d){
  LIST=d.orders;const act=LIST.filter(o=>o.status!=="delivered").sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)),dn=LIST.filter(o=>o.status==="delivered");
  const wk=o=>Date.now()-new Date(o.created_at)<864e5*7,paid=LIST.filter(o=>o.paid&&wk(o)).reduce((a,o)=>a+o.earn,0),wait=LIST.filter(o=>o.ready&&!o.paid).reduce((a,o)=>a+o.earn,0),prog=LIST.filter(o=>!o.ready&&o.status!=="delivered").reduce((a,o)=>a+o.earn,0);
  $("#hn").textContent=d.name;$("#hs").textContent="Kitchen / supplier"+" · keep this page open to get new orders";$("#out").style.display="";
  document.title=(act.length?"("+act.length+") ":"")+"SmartyHub Partner";
  $("#app").innerHTML=`<div class="card"><div class="row"><span>Paid to your bank (7 days)</span><span class="big">${fmt(paid)}</span></div><div class="row" style="margin-top:8px"><span class="mu">Shipped, waiting for payment</span><b>${fmt(wait)}</b></div><div class="row" style="margin-top:4px"><span class="mu">In progress</span><b>${fmt(prog)}</b></div></div>
  <h2>Active orders (${act.length})</h2>${act.map(o=>card(o,LIST.indexOf(o))).join("")||'<div class="card mu">No active orders right now. New paid orders appear here automatically.</div>'}
  <h2>Delivered, last 7 days (${dn.length})</h2>
  ${dn.slice(0,15).map(o=>`<div class="card"><div class="row"><span class="ref">${esc(o.ref)}</span><span>${fmt(o.earn)}</span></div><div class="mu">${o.items.map(x=>x.q+"× "+esc(x.n)).join(", ")}</div></div>`).join("")}`;
}
async function load(first){
  if(busy)return;busy=true;
  try{const d=await api({action:"orders",token:T});
    const fresh=d.orders.filter(o=>o.status==="new").map(o=>o.ref);
    if(seen!==null&&fresh.some(r=>!seen.has(r)))beep();seen=new Set(fresh);render(d)}
  catch(e){if(e.message!=="auth"&&first)$("#app").innerHTML=`<div class="card err">${esc(e.message)}</div>`}
  busy=false}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;const o=LIST[+b.dataset.i];if(!o)return;
  if(b.dataset.a==="ready"&&!confirm("Mark "+o.ref+" as shipped? Your payment will be sent to your bank account."))return;
  b.disabled=true;b.textContent="Please wait…";
  try{await api({action:"update",action2:b.dataset.a,ref:o.ref,token:T});toast("Updated");busy=false;load()}
  catch(err){if(err.message!=="auth")toast(err.message);b.disabled=false;busy=false;load()}});
function start(){$("#app").innerHTML='<p class="mu" style="text-align:center;padding:40px 0">Loading…</p>';load(true);clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)load()},20000)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&T)load()});
if(!C.url||!C.key)$("#app").innerHTML='<div class="card err">This page is not connected yet.</div>';else T?start():loginView();
</script>
</body>
</html>
